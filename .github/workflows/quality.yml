name: HORAE quality checks

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check < Code.gs
      - name: Validate web app manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.webmanifest', 'utf8'))"
      - name: Verify required PWA files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s sw.js
          test -s manifest.webmanifest
          test -s icons/icon-192.png
          test -s icons/icon-512.png
